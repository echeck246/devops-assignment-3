name: CI Pipeline

on:
  push:
    branches: [ main, feature/*, ci-* ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh *.sh 2>/dev/null || true

      - name: Run Linting and Static Checks
        run: ./scripts/lint.sh

  test:
    name: Automated Unit & Functional Tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh *.sh 2>/dev/null || true

      - name: Execute Test Suite
        run: ./tests/test.sh

  docker:
    name: Docker Build & Smoke Tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make Scripts Executable
        run: chmod +x app/*.sh scripts/*.sh tests/*.sh *.sh 2>/dev/null || true

      - name: Build Image and Run Container Smoke Tests
        run: ./scripts/build.sh
